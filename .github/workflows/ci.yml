name: Container security

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build, scan and publish ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, notifier]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile${{ matrix.service == 'api' && '.multi' || '' }}
          load: true
          tags: local-${{ matrix.service }}:ci
          secrets: |
            build_secret=ci-build-secret

      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local-${{ matrix.service }}:ci
          format: table
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.service }} image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile${{ matrix.service == 'api' && '.multi' || '' }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}
          secrets: |
            build_secret=ci-build-secret

  deploy:
    name: Simulated deployment
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare local deployment secret
        run: |
          mkdir -p secrets
          printf 'ci-demo-password' > secrets/db_password.txt
          printf 'POSTGRES_USER=postgres\nPOSTGRES_DB=demo\nPGHOST=demo-db\nPGPORT=5432\nPGUSER=postgres\nPGDATABASE=demo\nNOTIFIER_URL=http://notifier:3001\nNOTIFIER_PORT=3001\n' > .env

      - name: Pull and start deployed stack
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: docker compose pull && docker compose up -d

      - name: Verify deployed API and notifier
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/health
          docker compose ps
          docker compose logs --no-color notifier